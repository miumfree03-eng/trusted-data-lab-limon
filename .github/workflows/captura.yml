name: Captura Bronce y pipeline Plata-Oro

on:
  schedule:
    - cron: "0 22 * * 1-5"   # lunes a viernes, 16:00 hora de Colima (UTC-6)
  workflow_dispatch:        # permite correrla a mano desde la pestaña Actions

permissions:
  contents: write

concurrency:
  group: captura-bronce
  cancel-in-progress: false

jobs:
  capturar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: SNIIM - precios del limón de Colima
        run: python extractores/sniim_limon.py

      - name: Banxico - tipo de cambio FIX
        env:
          BANXICO_TOKEN: ${{ secrets.BANXICO_TOKEN }}
        run: python extractores/banxico_fix.py

      - name: Frankfurter - tipo de cambio USD/MXN (BCE)
        run: python extractores/frankfurter_usdmxn.py

      - name: Prueba de estrés de la puerta de calidad
        run: python tests/test_puerta_calidad.py

      - name: Pipeline Bronce -> Plata -> Oro
        run: python src/pipeline.py

      - name: Guardar datos nuevos en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs/E1/reporte_calidad.md
          if git diff --cached --quiet; then
            echo "Sin datos nuevos."
          else
            git commit -m "bronce: captura automática $(date -u +%Y-%m-%d)"
            git push
          fi
